name: Validate isolated registry correctness fixes
on:
  push:
    branches: ['validation/registry-core-batch6-20261116']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: balanced-catalog-link-destinations
            node: '20'
            head: 9044b88661087989097fe32ad0fd82db32c41f0e
            source: packages/catalog-builder/src/parseMarkdown.ts
            regression: packages/catalog-builder/test/parseMarkdown.test.ts
            failures: 9
          - name: balanced-catalog-link-destinations
            node: '24'
            head: 9044b88661087989097fe32ad0fd82db32c41f0e
            source: packages/catalog-builder/src/parseMarkdown.ts
            regression: packages/catalog-builder/test/parseMarkdown.test.ts
            failures: 9
          - name: catalog-grouped-tool-counts
            node: '20'
            head: f229fc785d210cc15aaf0f951f06c8fce2cbdc63
            source: packages/catalog-builder/src/buildCatalog.ts
            regression: packages/catalog-builder/test/buildCatalog.test.ts
            failures: 13
          - name: catalog-grouped-tool-counts
            node: '24'
            head: f229fc785d210cc15aaf0f951f06c8fce2cbdc63
            source: packages/catalog-builder/src/buildCatalog.ts
            regression: packages/catalog-builder/test/buildCatalog.test.ts
            failures: 13
          - name: registry-head-method
            node: '20'
            head: aae74bf4afe2e5c4679f039a627ff87c32e8ac0e
            source: packages/registry-api/src/server.ts
            regression: packages/registry-api/test/server.test.ts
            failures: 20
          - name: registry-head-method
            node: '24'
            head: aae74bf4afe2e5c4679f039a627ff87c32e8ac0e
            source: packages/registry-api/src/server.ts
            regression: packages/registry-api/test/server.test.ts
            failures: 20
    env:
      SOURCE_FILE: ${{ matrix.source }}
      REGRESSION_FILE: ${{ matrix.regression }}
      EXPECTED_FAILURES: ${{ matrix.failures }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reproduce the regression on unchanged production code
        run: |
          git restore --source=9b8152c14c7b14249128868d2c2e8ef0a2e20acb -- "$SOURCE_FILE"
          set +e
          npx vitest run "$REGRESSION_FILE" --reporter=json --outputFile=baseline.json
          result=$?
          set -e
          test "$result" -eq 1
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("baseline.json", "utf8"));
          console.log(JSON.stringify({ baselineFailed: report.numFailedTests, baselinePassed: report.numPassedTests }));
          if (report.numFailedTests !== Number(process.env.EXPECTED_FAILURES)) throw new Error("Unexpected baseline failure count");
          JS
      - name: Restore and verify the exact independent candidate
        run: |
          git restore --source=${{ matrix.head }} -- "$SOURCE_FILE"
          git diff --exit-code -- packages
          npm run catalog:build
          npm run profiles:build
          npm test -- --reporter=json --outputFile=candidate.json
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("candidate.json", "utf8"));
          console.log(JSON.stringify({ candidateFailed: report.numFailedTests, candidatePassed: report.numPassedTests, candidatePending: report.numPendingTests }));
          if (report.numFailedTests !== 0) throw new Error("Candidate regressions failed");
          JS
          npm run typecheck
          npm run build
          git diff --exit-code -- packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-${{ matrix.name }}-node${{ matrix.node }}
          path: |
            baseline.json
            candidate.json
